<section id="work">
    <h2 class="work-title"><a href="/portfolio">Portfolio</a></h2>
    <div class="work-container">

        {% for item in site.data.settings.portfolio %}
            <a href="/{{ item.folder }}" class="work-unit" style="background-image: url(/assets/img/portfolio/{{ item.folder }}/thumbnail.webp);">
                <div class="work-overlay">
                    <strong> {{ item.name }} </strong>
                </div>
            </a>
        {% endfor %}

    </div>
</section>
