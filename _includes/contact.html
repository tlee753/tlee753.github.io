<section id="contact">
    <h2 class="contact-title"><a href="/contact">Contact</a></h2>

    <div class="contact-lockup">
        {% for socialmedia in site.data.settings.social %}
            <a href="{{ socialmedia.link }}"><div class="contact-item socialcolor">
                {% include social-icons/{{ socialmedia.icon }}.svg %}
            </div></a>
        {% endfor %}
    </div>
</section>
